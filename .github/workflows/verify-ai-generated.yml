name: AI-generated standalone tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  standalone-tests:
    # Pushes and manual dispatches are covered by the main verify workflow.
    # Keep a read-only fallback for pull requests from forks.
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run AI-generated C++17 tests
        shell: bash
        run: bash .github/scripts/run_ai_generated_tests.sh
