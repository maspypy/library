name: source URLs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test source URL updater
        run: python -m unittest scripts/test_update_source_urls.py
      - name: Check source URL headers
        run: python scripts/update_source_urls.py --check
